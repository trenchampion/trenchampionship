[project]
name = "traitleague-sim"
version = "0.1.0"
description = "Balance and economy simulation for Trenchampionship (reads the same constants as Config.sol)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["traitleague_sim"]
