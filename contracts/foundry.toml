[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [
  { access = "read-write", path = "./" },
  { access = "read", path = "../engine/vectors" },
]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 10_000
max_test_rejects = 1_000_000

[invariant]
runs = 1_000
depth = 100
fail_on_revert = false

[profile.ci]
fuzz = { runs = 10_000 }
invariant = { runs = 2_000, depth = 200 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
