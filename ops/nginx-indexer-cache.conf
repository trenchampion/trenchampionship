# nginx micro-cache in front of the Ponder indexer.
# Caddy (TLS) -> nginx 127.0.0.1:8080 -> Ponder 127.0.0.1:42069
#
# Every visitor asks the same handful of GraphQL queries and the web app re-polls them every 15 s, so a 5 s cache
# with request collapsing turns N identical requests into one upstream call, and stale answers are served while
# Ponder is slow, restarting or re-syncing. Measured in docs/DEPLOY.md section 8: ~60 requests/s without the cache,
# 500-600 requests/s with it on one core.
proxy_cache_path /var/cache/nginx/indexer levels=1:2 keys_zone=indexer:16m max_size=200m inactive=10m use_temp_path=off;

# Caddy is the only client of this server; it appends the visitor's address as the last X-Forwarded-For entry,
# which the realip module turns back into $remote_addr (spoof-proof: Caddy appends, never trusts, the header).
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;

# Per-IP rate limit as abuse protection only: 30 requests/s sustained, bursts of 60. A tab of the app makes a few
# requests per 15 s; NAT'd offices share an IP, hence the generous numbers. (Capacity tests from one IP must raise
# the rate temporarily; docs/DEPLOY.md section 8.)
limit_req_zone $binary_remote_addr zone=graphql_ip:8m rate=30r/s;
limit_req_status 429;

server {
    listen 127.0.0.1:8080;
    server_name _;
    client_max_body_size 64k;

    location /graphql {
        limit_req zone=graphql_ip burst=60 nodelay;
        proxy_pass http://127.0.0.1:42069;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache indexer;
        proxy_cache_methods GET HEAD POST;
        proxy_cache_key "$request_method$request_uri|$request_body";
        proxy_cache_valid 200 5s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_read_timeout 30s;
        proxy_buffers 16 16k;
        proxy_buffer_size 16k;
        add_header X-Cache $upstream_cache_status always;
    }

    # /health, /ready, /status, /sql/* pass straight through (not cached)
    location / {
        proxy_pass http://127.0.0.1:42069;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}
